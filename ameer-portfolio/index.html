<!doctype html>
<html lang="en" class="bg-[#0F1B2E] text-white selection:bg-[#D4AF37] selection:text-[#0F1B2E]">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F1B2E" />

    <!-- Favicon Variants & Web Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <title>Ameer Saqer | Front-End Developer</title>
    <meta name="description" content="Front-End Developer specializing in React, Tailwind CSS, and performance optimization. Crafting fast, responsive, and pixel-perfect digital experiences." />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ameer Saqer | Front-End Developer" />
    <meta property="og:description" content="Front-End Developer specializing in React, Tailwind CSS, and performance optimization. Crafting fast, responsive, and pixel-perfect digital experiences." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ameer Saqer — Front-End Developer" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ameer Saqer | Front-End Developer" />
    <meta name="twitter:description" content="Front-End Developer specializing in React, Tailwind CSS, and performance optimization. Crafting fast, responsive, and pixel-perfect digital experiences." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Preload Hero Portrait for Instant LCP -->
    <link rel="preload" as="image" href="/images/ameer-cutout.webp" fetchpriority="high" />

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Core Critical Fonts (Display, Body Sans & Mono) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Non-blocking Secondary Accent Fonts (Quote serif & Handwritten script) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Playfair+Display:ital,wght@1,400&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Playfair+Display:ital,wght@1,400&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body class="bg-[#0F1B2E] text-white overflow-x-hidden antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
